# Copy to inventory.ini (git-ignored) and set your values.
# ansible_user: Proxmox = ansible, Azure = azureuser, AWS = ubuntu, GCP = ansible (or your OS Login user)

# replace with your workbench IP address
[workbench]
posit-workbench ansible_host=192.168.x.x

# replace with your connect IP address
[connect]
posit-connect ansible_host=192.168.x.x

[all:vars]
ansible_user=ansible
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_become=true
